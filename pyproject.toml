[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "transfer-bci"
description = "Transfer-BCI: Transfer Learning and Domain Adaptation for Brain-Computer Interface"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dynamic = ["version"]

authors = [
    { name = "Simon Kojima" },
]

dependencies = []

[tool.setuptools.dynamic]
version = { attr = "transfer_bci.__version__" }

[tool.setuptools.packages.find]
where = ["."]
include = ["transfer_bci*"]
